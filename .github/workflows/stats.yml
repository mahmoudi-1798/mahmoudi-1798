name: Redraw README images

on:
  schedule:
    - cron: "17 3 * * *" # every day, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw SVGs
        env:
          # STATS_TOKEN = classic PAT with `repo` + `read:user`, so private work is counted.
          # Without it, falls back to the built-in token (public data only).
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python3 scripts/render.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || { git commit -m "chore: redraw stats"; git push; }
